{% extends 'base.html' %}
{% block title %}{{ code }}{% endblock %}
{% block body %}
<div class="flex items-center justify-center min-h-screen p-4"><div class="bg-[#1d2939] p-10 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700 text-center">
  <p class="text-6xl font-black text-indigo-400">{{ code }}</p>
  <h1 class="text-xl font-bold text-white mt-2">{{ title }}</h1>
  <p class="text-sm text-slate-400 mt-2 mb-6">{{ message }}</p>
  <a href="/" class="{{ ui.btn }}">Back to Home</a>
</div></div>
{% endblock %}
